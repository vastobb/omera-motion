plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omeramotion.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omeramotion.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // Keep the WebView debuggable so the bundled editor can be inspected.
        debuggable true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfigs signingConfigs.debug  // debug keystore for CI artifact
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}

dependencies {
    implementation 'com.getcapacitor:capacitor-android:6.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
}
