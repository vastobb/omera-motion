name: Build APK (omera motion)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'server/**', 'config/**', 'package.json', 'capacitor.config.ts', '.github/workflows/build-apk.yml']

permissions:
  contents: read
  actions: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --loglevel=error --no-audit --no-fund
        env:
          # Skip optional native downloads during the web build; the APK bundles
          # only the Vite web UI. Native media work runs via the Termux backend.
          ONNXRUNTIME_NODE_INSTALL: 'skip'

      - name: Build web UI (Vite -> dist/)
        run: npx vite build --config config/vite.config.ts

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          GRADLE_VERSION=8.10.2
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /opt
          echo "GRADLE_HOME=/opt/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Bundle web UI into Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/
          ls android/app/src/main/assets/public

      - name: Assemble debug APK
        run: cd android && gradle assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_USER_HOME: /tmp/gradle-user-home

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: omera-motion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          generate_release_notes: true
